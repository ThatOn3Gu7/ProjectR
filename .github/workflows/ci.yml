name: ProjectR CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install test tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core shellcheck

      - name: Bash syntax check
        run: |
          bash -n main.sh setup.sh $(find lib examples tests -name '*.sh' | sort)

      - name: ShellCheck
        run: |
          shellcheck -S warning main.sh setup.sh $(find lib -name '*.sh' | sort)

      - name: Registry audit
        run: |
          bash main.sh audit --strict

      - name: CLI smoke tests
        run: |
          bash main.sh --help >/tmp/projectr-help.txt
          bash main.sh --version
          bash main.sh doctor --json
          bash main.sh dry-run install git --json
          bash main.sh dry-run repair --json
          bash main.sh scheduler status || true

      - name: Bats test suite
        if: runner.os == 'Linux'
        run: |
          bats tests/suite.bats

      - name: Library smoke test
        run: |
          bash tests/library_smoke.sh
